name: Test scripts

# Runs the unit tests under tests/ for the scripts that write deck files
# (scripts/merge_level_decks.py and the deckbuilder, scripts/build_deck.py
# with scripts/deckbuilder/), so a change that writes a deck the app or the
# schema does not accept fails in its PR rather than in the deck PR that uses
# the script next. The tests build their own inputs, answer the deckbuilder's
# sources from recorded responses and need no network; they do not read
# data/decks/, and read recipes/ only to check every recipe against
# schema/recipe.schema.json. duckdb is not installed: only the deckbuilder's water
# flags need it, and they are not fetched in the tests. -B keeps Python from
# writing __pycache__ into the checkout, as locally, where nothing ignores
# it.
on:
  pull_request:
    paths:
      - "scripts/merge_level_decks.py"
      - "scripts/build_deck.py"
      - "scripts/deckbuilder/**"
      - "recipes/**"
      - "tests/**"
      - "schema/**"
      - ".github/workflows/test-scripts.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "jsonschema[format]==4.23.0"
      - run: python3 -B -m unittest discover -s tests -v
