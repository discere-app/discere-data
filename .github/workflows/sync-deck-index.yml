name: Sync deck index

# Regenerates the deck indexes (one per format version) after a deck PR is
# merged to main, or a schema change that may raise the newest format, and
# lets a maintainer re-run it manually (Actions tab -> "Run workflow").
# Push-triggered runs of this workflow are skipped automatically via the
# "[skip ci]" marker in scripts/sync_index.sh's own commit message, so the
# commit it creates does not re-trigger this workflow.
#
# Pushes with an installation token of the repository's GitHub App
# (vars.DECK_SYNC_APP_ID, secrets.DECK_SYNC_APP_PRIVATE_KEY; contents:
# read/write on this repo only) and commits as that app's bot. main is
# rule-protected ("changes must be made through a pull request"); the app is
# in that ruleset's bypass list, so it may push to main directly. The token
# lives for an hour, and no personal token is involved that could expire.
# The default GITHUB_TOKEN would not do: it authenticates as the
# github-actions bot, which a bypass entry does not cover.
on:
  push:
    branches: [main]
    paths:
      - "data/decks/*.json"
      - "schema/deck.schema.json"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-deck-index
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.DECK_SYNC_APP_ID }}
          private-key: ${{ secrets.DECK_SYNC_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Commit as the app's bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Regenerate deck index
        run: ./scripts/sync_index.sh
