name: Generate deck index

on:
  push:
    branches: [main]
    paths:
      - 'data/decks/*.json'
      - '!data/decks/index.json'

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate index.json
        run: |
          cd data/decks
          # Merge all deck JSON files (excluding index.json) into a single array
          jq -s '.' $(ls -1 *.json | grep -v '^index\.json$' | sort) > index.json
          echo "Generated index.json with $(jq length index.json) decks"

      - name: Commit and push
        run: |
          git config user.name "Forgejo Actions"
          git config user.email "actions@noreply.codeberg.org"
          git add data/decks/index.json
          if git diff --cached --quiet; then
            echo "index.json is already up to date"
          else
            git commit -m "chore: regenerate deck index.json"
            git push
          fi